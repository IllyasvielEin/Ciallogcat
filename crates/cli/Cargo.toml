[package]
name = "ciallogcat-cli"
version = "1.4.0"
edition = "2024"
license = "MIT"
publish = false
autobins = false
autotests = false

[[bin]]
name = "ciallogcat-cli"
path = "../../src/bin/ciallogcat-cli.rs"

[[test]]
name = "agent_loop"
path = "../../tests/agent_loop.rs"

[[test]]
name = "cli_integration"
path = "../../tests/cli_integration.rs"

[[test]]
name = "cli_query_upgrade"
path = "../../tests/cli_query_upgrade.rs"

[[test]]
name = "cli_stale_stop"
path = "../../tests/cli_stale_stop.rs"

[[test]]
name = "cli_text_output"
path = "../../tests/cli_text_output.rs"

[[test]]
name = "document_query_tests"
path = "../../tests/document_query_tests.rs"

[[test]]
name = "native_adb_integration"
path = "../../tests/native_adb_integration.rs"

[[test]]
name = "query_integration"
path = "../../tests/query_integration.rs"

[dependencies]
ciallogcat = { package = "ciallogcat-core", path = "../core" }
jiff = "0.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"
base64 = "0.22"
ctrlc = "3.5"
hmac = "0.12"
regex = "1"
prost = "=0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
