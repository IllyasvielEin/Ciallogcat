name: Release

on:
  push:
    tags:
      - 'gui-v[0-9]*.[0-9]*.[0-9]*'
      - 'cli-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release plan
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Release policy tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_release_*.py'
      - name: Validate version, scope and notes
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_policy.py --tag "$RELEASE_TAG"

  build:
    name: Check and package (${{ matrix.platform }})
    needs: preflight
    if: needs.preflight.outputs.scope == 'gui'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev dpkg-dev desktop-file-utils
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --locked -p ciallogcat -p ciallogcat-core
      - name: Clippy
        run: cargo clippy --locked -p ciallogcat -p ciallogcat-core --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release -p ciallogcat
      - name: Verify GUI version without a display
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $binary = if ($IsWindows) { './target/release/ciallogcat.exe' } else { './target/release/ciallogcat' }
          $reported = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $reported -cne "Ciallogcat GUI $env:EXPECTED_VERSION") {
            throw 'GUI binary version does not match the release plan'
          }
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: ./.github/scripts/package.ps1
      - name: Install Debian packager
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build and verify Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/package-deb.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: target/release-dist/*
          if-no-files-found: error
          retention-days: 7

  cli:
    name: Check and package headless CLI (${{ matrix.platform }})
    needs: preflight
    if: needs.preflight.outputs.scope == 'cli'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust (no GUI dependencies)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-cli
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all --check
      - name: Headless tests
        run: cargo test --locked -p ciallogcat-cli -p ciallogcat-core
      - name: Headless Clippy
        run: cargo clippy --locked -p ciallogcat-cli -p ciallogcat-core --all-targets -- -D warnings
      - name: CLI release build
        run: cargo build --locked --release -p ciallogcat-cli
      - name: CLI smoke test
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $binary = if ($IsWindows) { './target/release/ciallogcat-cli.exe' } else { './target/release/ciallogcat-cli' }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke test failed' }
          $reported = & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version smoke test failed' }
          if (($reported | ConvertFrom-Json).version -cne $env:EXPECTED_VERSION) {
            throw 'CLI binary version does not match the release plan'
          }
      - name: Install CLI Debian packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: CLI packaging tests
        run: python -m unittest discover -s .github/scripts -p test_package_cli.py
      - name: Package CLI only
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python .github/scripts/package-cli.py
      - name: Verify CLI Debian installation and removal
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm \
            -v "$PWD/target/cli-release-dist:/packages:ro" \
            -v "$PWD/.github/scripts/verify-cli-deb.sh:/verify-cli-deb.sh:ro" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:24.04 bash /verify-cli-deb.sh "/packages/ciallogcat-cli-${RELEASE_TAG#cli-}-linux-x86_64.deb"
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.platform }}
          path: target/cli-release-dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [preflight, build, cli]
    if: >-
      ${{
        always() && !cancelled() &&
        github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
        needs.preflight.result == 'success' &&
        (
          (needs.preflight.outputs.scope == 'cli' && needs.cli.result == 'success' && needs.build.result == 'skipped') ||
          (needs.preflight.outputs.scope == 'gui' && needs.build.result == 'success' && needs.cli.result == 'skipped')
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        if: needs.preflight.outputs.scope == 'cli'
        with:
          name: cli-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v7
        if: needs.preflight.outputs.scope == 'cli'
        with:
          name: cli-windows-x86_64
          path: dist
      - uses: actions/download-artifact@v7
        if: needs.preflight.outputs.scope == 'gui'
        with:
          name: linux-x86_64
          path: dist
      - uses: actions/download-artifact@v7
        if: needs.preflight.outputs.scope == 'gui'
        with:
          name: windows-x86_64
          path: dist
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/publish-release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
