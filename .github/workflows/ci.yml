name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev dpkg-dev desktop-file-utils
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'ciallogcat').version
          $shortTag = if ($version -match '^([0-9]+)\.([0-9]+)\.0$') { "v$($Matches[1]).$($Matches[2])" } else { $null }
          if ($env:RELEASE_TAG -cne "v$version" -and $env:RELEASE_TAG -cne $shortTag) {
            throw "Tag $env:RELEASE_TAG must match Cargo version v$version"
          }
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: ./.github/scripts/package.ps1
      - name: Install Debian packager
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build and verify Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/package-deb.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: target/release-dist/*
          if-no-files-found: error
          retention-days: 7

  cli:
    name: Check and package headless CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (no GUI dependencies)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-cli
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all --check
      - name: Headless tests
        run: cargo test --locked --no-default-features
      - name: Headless Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: CLI release build
        run: cargo build --locked --release --no-default-features --bin ciallogcat-cli
      - name: CLI smoke test
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './target/release/ciallogcat-cli.exe' } else { './target/release/ciallogcat-cli' }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke test failed' }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version smoke test failed' }
      - name: CLI packaging tests
        run: python -m unittest discover -s .github/scripts -p test_package_cli.py
      - name: Package CLI only
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python .github/scripts/package-cli.py
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.platform }}
          path: target/cli-release-dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [[ "$(jq -r '.isDraft' release-state.json)" != true ]]; then
              echo 'Release is already public; published assets will not be overwritten.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Ciallogcat $RELEASE_TAG" --generate-notes \
              --notes 'v1.0 introduces a shared headless Logcat core and a separate ciallogcat-cli for device discovery, bounded JSONL capture, and local background session start/status/query/stop. The default desktop application is retained. CLI-only builds omit GUI dependencies; standalone Windows x86_64 ZIP and Linux x86_64 tar.gz archives contain the CLI, MIT license and usage guide. GUI archives and an Ubuntu 24.04 DEB are also included. Install ADB separately. All GUI and CLI matrix jobs must pass before publication; DEB installation and removal are checked in a clean Ubuntu 24.04 container. Automated checks do not establish real-device capture, long-running memory behavior, Windows runtime or desktop interaction acceptance. Linux GUI packages require compatible system libraries and a graphical desktop.'
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.deb ./*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
