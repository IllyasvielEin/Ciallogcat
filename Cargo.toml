[package]
name = "ciallogcat"
version = "0.1.0"
edition = "2024"
description = "A desktop Android Logcat viewer built with Rust and egui"
repository = "https://github.com/IllyasvielEin/Ciallogcat"
license = "MIT"
publish = false

[dependencies]
eframe = "0.36.1"
egui_extras = "0.36.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
