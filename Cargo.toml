[workspace]
members = [".", "crates/core", "crates/cli"]
default-members = [".", "crates/core", "crates/cli"]
resolver = "3"

[package]
name = "ciallogcat"
version = "1.3.1"
edition = "2024"
default-run = "ciallogcat"
autolib = false
autobins = false
autotests = false
description = "A desktop Android Logcat viewer built with Rust and egui"
repository = "https://github.com/IllyasvielEin/Ciallogcat"
license = "MIT"
publish = false

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rust-i18n"]
# Offscreen rendering is contributor tooling, excluded from normal builds.
ui-snapshot = ["gui", "dep:egui_kittest"]

[[bin]]
name = "ciallogcat"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
ciallogcat = { package = "ciallogcat-core", path = "crates/core" }
eframe = { version = "0.36.1", optional = true }
egui_extras = { version = "0.36.1", optional = true }
rust-i18n = { version = "4.2.4", optional = true }
egui_kittest = { version = "0.36.1", optional = true, features = ["eframe", "wgpu"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.deb]
revision = ""
maintainer = "IllyasvielEin <IllyasvielEin@users.noreply.github.com>"
copyright = "2026 Ciallogcat contributors"
license-file = ["LICENSE", "0"]
extended-description = "Desktop Android Logcat viewer with filtering, multi-row copying and live capture. Built for Ubuntu 24.04 x86_64; requires a graphical desktop."
section = "devel"
priority = "optional"
depends = "$auto, libx11-6, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libegl1, libgl1, libvulkan1"
recommends = "adb, mesa-vulkan-drivers"
assets = [
    ["target/release/ciallogcat", "usr/bin/ciallogcat", "755"],
    ["assets/linux/ciallogcat.desktop", "usr/share/applications/ciallogcat.desktop", "644"],
    ["assets/linux/ciallogcat.svg", "usr/share/icons/hicolor/scalable/apps/ciallogcat.svg", "644"],
    ["README.md", "usr/share/doc/ciallogcat/README.md", "644"],
    ["README.zh-CN.md", "usr/share/doc/ciallogcat/README.zh-CN.md", "644"],
    ["CONTRIBUTING.md", "usr/share/doc/ciallogcat/CONTRIBUTING.md", "644"],
    ["proto/*", "usr/share/doc/ciallogcat/proto/", "644"],
    ["docs/*.md", "usr/share/doc/ciallogcat/guides/", "644"],
    ["assets/fonts/LICENSE-OFL.txt", "usr/share/doc/ciallogcat/fonts/LICENSE-OFL.txt", "644"],
    ["assets/fonts/LICENSE-NOTO-OFL.txt", "usr/share/doc/ciallogcat/fonts/LICENSE-NOTO-OFL.txt", "644"],
    ["assets/fonts/README.md", "usr/share/doc/ciallogcat/fonts/README.md", "644"],
]
